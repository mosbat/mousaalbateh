{{- $src := .Get "src" -}}
{{- $title := .Get "title" | default "Video" -}}

{{- if not $src -}}
  {{- errorf "hls-player shortcode requires a src parameter: %s" .Position -}}
{{- end -}}

{{- if not (.Page.Store.Get "vidstackLoaded") -}}
  {{- .Page.Store.Set "vidstackLoaded" true -}}

  <link
    rel="stylesheet"
    href="https://cdn.vidstack.io/player/theme.css"
  >
  <link
    rel="stylesheet"
    href="https://cdn.vidstack.io/player/video.css"
  >
  <script
    type="module"
    src="https://cdn.vidstack.io/player"
  ></script>
{{- end -}}

<div class="not-prose" style="margin: 1.5rem 0;">
  <media-player
    title="{{ $title }}"
    src="{{ $src }}"
    load="play"
    playsinline
    style="display: block; width: 100%; aspect-ratio: 16 / 9;"
  >
    <media-provider></media-provider>

    <media-video-layout>
    </media-video-layout>
  </media-player>
</div>
